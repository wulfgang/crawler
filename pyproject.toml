[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawler"
description = "A high-performance web crawler for data extraction"
version = "0.2.1"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx[http2]>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "elasticsearch[async]>=8.10.0",
    "python-multipart>=0.0.6",  # For handling file uploads if needed
    "aiofiles>=23.2.0",  # For async file operations
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
    "mkdocs>=1.4.0",
    "aioresponses>=0.7.0",
    "elasticsearch-dsl>=8.10.0",  # For testing and development
    "pytest-docker>=2.0.0",  # For running Elasticsearch in tests
]

[project.scripts]
crawler = "crawler.cli:main"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --cov=crawler --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["crawler"]
omit = ["**/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[project.urls]
"Homepage" = "https://github.com/yourusername/crawler"
"Bug Tracker" = "https://github.com/yourusername/crawler/issues"
